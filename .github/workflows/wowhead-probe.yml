# One-off: fetch a few Wowhead pages so the scraper's parser can be written against the real
# markup. Run by hand only. Wowhead gave permission for occasional scrapes of vendor, mob and
# location data (a few times a month, never constant traffic).
name: Wowhead probe
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "NPC IDs, space separated"
        default: "1096 2843 1347"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          mkdir pages
          for id in ${{ github.event.inputs.ids }}; do
            curl -sS -A "HaulwiseDataBot/1.0 (+https://github.com/KaayceeGamer/haulwise)" -o "pages/npc-$id.html" "https://www.wowhead.com/forever/npc=$id"
            sleep 3
          done
          ls -la pages
      - uses: actions/upload-artifact@v4
        with:
          name: wowhead-pages
          path: pages

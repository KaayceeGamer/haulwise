# Release to CurseForge right away, for urgent fixes: run it by hand (Actions > Release > Run
# workflow). It tags the version in Core.lua (bump it first) and uploads. Everything else goes
# out with the daily Community data upload. Pushing a tag no longer releases anything.
name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: github.event_name == 'workflow_dispatch'
        name: Tag the version in Core.lua
        run: |
          version=$(grep -o 'GP.VERSION = "[^"]*"' Core.lua | cut -d'"' -f2)
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump GP.VERSION in Core.lua first."
            exit 1
          fi
          git config user.name "haulwise-bot"
          git config user.email "haulwise-bot@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
      - uses: BigWigsMods/packager@v2
        with:
          args: -p 1812709 -n "Haulwise {project-version}:{package-name}-{project-version}"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
